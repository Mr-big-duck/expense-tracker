<!DOCTYPE html>
<html lang = "zh-CN">
    <head>
        <meta charset = "utf-8">
        <title>
            记账
        </title>
    </head>
    <body>
        <h1>
            记一笔新账
        </h1>

        {%with messages = get_flashed_messages()%}
            {%if messages%}
            <ul style = "color:red;">
                {%for message in messages%}
                <li>
                    {{message}}
                </li>
                {%endfor%}
            </ul>
            {%endif%}
        {%endwith%}

        <form action = "/add" method = "post">
            <p>
                <label>金额：</label>
                <input type = "number" step = "0.01" name = "amount" required>
            </p>
            <p>
                <label>分类：</label>
                <input type = "text" name = "category" required>

            </p>
            <p>
                <label>备注：</label>
                <input type = "text" name = "note" required>

            </p>
            <p>
                <label>性质：</label>
                <input type = "text" name = "kind">
            </p>
            <button type = "submit">
                提交保存
            </button>

        </form>
        <br>
        <a href = "/">
            点击此处返回首页
        </a>
    </body>
</html>
